{% load static %}
<aside class="w-full lg:w-64 bg-[#0A0A32] border-b lg:border-b-0 lg:border-r border-white/10 flex flex-col justify-between shrink-0">
  <div>
    <!-- Brand Logo Header -->
    <div class="p-6 border-b border-white/10 flex items-center justify-between">
      <a href="{% url 'painel:dashboard' %}" class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-orange-500 via-amber-500 to-indigo-600 flex items-center justify-center text-white font-extrabold text-lg shadow-md border border-white/20">
          M
        </div>
        <div>
          <h1 class="font-extrabold text-base tracking-wide bg-gradient-to-r from-orange-400 via-amber-300 to-indigo-300 bg-clip-text text-transparent">MorARIs</h1>
          <span class="text-[10px] uppercase font-bold tracking-wider text-gray-400">Painel de Gestão</span>
        </div>
      </a>
    </div>

    <!-- Navigation Menu -->
    <nav class="p-4 space-y-1">
      <a href="{% url 'painel:dashboard' %}" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-sm text-gray-300 hover:bg-orange-500/10 hover:text-white transition">
        <i class="ri-dashboard-line text-lg text-orange-400"></i> Dashboard
      </a>
      
      <div class="pt-3 pb-1 px-4 text-[10px] font-extrabold uppercase tracking-widest text-orange-400">Catálogo</div>
      <a href="{% url 'painel:product_list' %}" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-sm text-gray-300 hover:bg-orange-500/10 hover:text-white transition">
        <i class="ri-stack-line text-lg text-orange-400"></i> Produtos
      </a>
      <a href="{% url 'painel:category_list' %}" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-sm text-gray-300 hover:bg-orange-500/10 hover:text-white transition">
        <i class="ri-folders-line text-lg text-orange-400"></i> Categorias
      </a>

      <div class="pt-3 pb-1 px-4 text-[10px] font-extrabold uppercase tracking-widest text-orange-400">Marketing</div>
      <a href="{% url 'painel:banner_list' %}" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-sm text-gray-300 hover:bg-orange-500/10 hover:text-white transition">
        <i class="ri-image-line text-lg text-orange-400"></i> Banners & Campanhas
      </a>
      <a href="{% url 'painel:testimonial_list' %}" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-sm text-gray-300 hover:bg-orange-500/10 hover:text-white transition">
        <i class="ri-chat-quote-line text-lg text-orange-400"></i> Depoimentos
      </a>
      <a href="{% url 'painel:marca_list' %}" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-sm text-gray-300 hover:bg-orange-500/10 hover:text-white transition">
        <i class="ri-badge-line text-lg text-orange-400"></i> Marcas Parceiras
      </a>

      <div class="pt-3 pb-1 px-4 text-[10px] font-extrabold uppercase tracking-widest text-orange-400">Institucional</div>
      <a href="{% url 'painel:sobre_empresa' %}" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-sm text-gray-300 hover:bg-orange-500/10 hover:text-white transition">
        <i class="ri-building-4-line text-lg text-orange-400"></i> Sobre a Empresa
      </a>
      <a href="{% url 'painel:unidade_list' %}" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-sm text-gray-300 hover:bg-orange-500/10 hover:text-white transition">
        <i class="ri-store-3-line text-lg text-orange-400"></i> Unidades & Showrooms
      </a>
    </nav>
  </div>

  <!-- Sidebar Bottom User Info -->
  <div class="p-4 border-t border-white/10 bg-[#0A0A32]">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3 truncate">
        <div class="w-8 h-8 rounded-full bg-orange-500/20 text-orange-400 font-bold flex items-center justify-center text-sm border border-orange-500/30 shrink-0">
          <i class="ri-user-3-line"></i>
        </div>
        <div class="truncate">
          <span class="block text-xs font-bold text-white truncate">{{ request.user.username|default:"Admin" }}</span>
          <span class="block text-[10px] text-gray-400">Sessão Ativa</span>
        </div>
      </div>
      <a href="{% url 'custom_admin_logout' %}" title="Sair" class="text-gray-400 hover:text-red-400 p-2 transition">
        <i class="ri-logout-box-r-line text-lg"></i>
      </a>
    </div>
  </div>
</aside>
