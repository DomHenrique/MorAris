{% extends 'painel/base_admin.html' %}
{% block page_title %}Excluir Depoimento{% endblock %}

{% block content %}
<div class="gridd-card p-6 max-w-xl mx-auto text-center">
  <div class="w-16 h-16 rounded-full bg-rose-500/20 text-rose-500 flex items-center justify-center mx-auto mb-4 text-3xl">
    <i class="ri-alert-line"></i>
  </div>
  <h3 class="text-xl font-bold text-white mb-2">Excluir Depoimento?</h3>
  <p class="text-gray-400 mb-6">Tem certeza que deseja excluir este depoimento? Esta ação não pode ser desfeita.</p>
  
  <form method="post" class="flex justify-center gap-3">
    {% csrf_token %}
    <a href="{% url 'painel:testimonial_list' %}" class="gridd-btn-secondary">Cancelar</a>
    <button type="submit" class="gridd-btn-danger">Sim, Excluir</button>
  </form>
</div>
{% endblock %}
